[manifest]
version = "1.0.0"
dump_lua = true
priority = -1

[[patches]]
[patches.pattern]
target = 'card.lua'
match_indent = true
position = 'after'
pattern = '''
booster_obj = self.config.center
'''
payload = '''
if self.config.center and self.config.center.original_mod then
	if next(SMODS.find_card("v_returnia_broken_abacus")) then
		self.ability.choose = self.ability.choose + G.GAME.returnia_modded_pack_choices
	end
end

G.GAME.returnia_pack_rerolled = false
'''


# Calculation Error (1/10) - Vanilla Booster UI
[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = '''{n=G.UIT.R,config={align = "tm",padding = 0.2, minh = 1.2, minw = 1.8, r=0.15,colour = G.C.GREY, one_press = true, button = 'skip_booster', hover = true,shadow = true, func = 'can_skip_booster'}, nodes = {'''
position = 'at'
match_indent = true
payload = '''
(G.GAME.used_vouchers['v_returnia_calculation_error'] and not G.GAME.rerolled_pack and
UIBox_button({label = {localize('k_reroll')}, padding = 0.07, minh = 0.7, minw = 1.8, r = 0.15, one_press = true, button = 'reroll_booster_pack', func = 'reroll_booster_pack_button'}) or nil),
G.GAME.used_vouchers['v_returnia_calculation_error'] and {n=G.UIT.R,config = {minh = 0.07}, nodes={}},
{n=G.UIT.R, config = {align = G.GAME.used_vouchers['v_returnia_calculation_error'] and 'cm' or 'tm', padding = G.GAME.used_vouchers['v_returnia_calculation_error'] and 0.07 or 0.2, minh = G.GAME.used_vouchers['v_returnia_calculation_error'] and 0.7 or 1.2, minw = 1.8, r = 0.15, colour = G.C.GREY, one_press = true, button = 'skip_booster', hover = true, shadow = true, func = 'can_skip_booster'}, nodes = {
'''

# Calculation Error (2/10) - Steamodded Booster UI
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/game_object.lua"]'
pattern = '''{n=G.UIT.R,config={align = "tm",padding = 0.2, minh = 1.2, minw = 1.8, r=0.15,colour = G.C.GREY, one_press = true, button = 'skip_booster', hover = true,shadow = true, func = 'can_skip_booster'}, nodes = {'''
position = 'at'
match_indent = true
payload = '''
(G.GAME.used_vouchers['v_returnia_calculation_error'] and not G.GAME.rerolled_pack and
UIBox_button({label = {localize('k_reroll')}, padding = 0.07, minh = 0.7, minw = 1.8, r = 0.15, one_press = true, button = 'reroll_booster_pack', func = 'reroll_booster_pack_button'}) or nil),
G.GAME.used_vouchers['v_returnia_calculation_error'] and {n=G.UIT.R,config = {minh = 0.07}, nodes={}},
{n=G.UIT.R, config = {align = G.GAME.used_vouchers['v_returnia_calculation_error'] and 'cm' or 'tm', padding = G.GAME.used_vouchers['v_returnia_calculation_error'] and 0.07 or 0.2, minh = G.GAME.used_vouchers['v_returnia_calculation_error'] and 0.7 or 1.2, minw = 1.8, r = 0.15, colour = G.C.GREY, one_press = true, button = 'skip_booster', hover = true, shadow = true, func = 'can_skip_booster'}, nodes = {
'''

# Calculation Error (3/10) - Reroll callbacks
[[patches]]
[patches.pattern]
target = 'functions/button_callbacks.lua'
pattern = 'G.FUNCS.reroll_boss_button = function(e)'
position = 'before'
match_indent = true
payload = '''
G.FUNCS.reroll_booster_pack_button = function(e)
    if (not G.GAME.rerolled_pack)
    and G.GAME.used_vouchers['v_returnia_calculation_error']
    and (G.pack_cards and G.STATE == G.STATES.SMODS_BOOSTER_OPENED
    or (G.STATE == G.STATES.PLANET_PACK
    or G.STATE == G.STATES.STANDARD_PACK
    or G.STATE == G.STATES.BUFFOON_PACK
    or (G.hand and (G.hand.cards[1] or (G.hand.config.card_limit <= 0))))) then
        e.config.colour = G.C.GREEN
        e.config.button = 'reroll_booster_pack'
        e.children[1].children[1].config.shadow = true
        if e.children[2] then
            e.children[2].children[1].config.shadow = true
        end
    else
        e.config.colour = G.C.UI.BACKGROUND_INACTIVE
        e.config.button = nil
        e.children[1].children[1].config.shadow = false
        if e.children[2] then
            e.children[2].children[1].config.shadow = false
        end
    end
end

G.FUNCS.reroll_booster_pack = function(e)
    if G.pack_cards and
    (G.STATE == G.STATES.SMODS_BOOSTER_OPENED
    or G.STATE == G.STATES.PLANET_PACK
    or G.STATE == G.STATES.STANDARD_PACK
    or G.STATE == G.STATES.BUFFOON_PACK
    or (G.hand and (G.hand.cards[1] or (G.hand.config.card_limit <= 0)))) then
        stop_use()

        local last_pack = G.GAME.last_booster_pack
        if not last_pack or G.GAME.rerolled_pack then return end

        last_pack.cost = 0
        last_pack.rerolled = true

        for i = #G.pack_cards.cards, 1, -1 do
            local c = G.pack_cards:remove_card(G.pack_cards.cards[i])
            c:remove()
            c = nil
        end

        G.E_MANAGER:add_event(Event({
            blocking = false,
            trigger = 'after',
            func = function()
                play_sound('other1')
                last_pack:open()
                return true
            end
        }))
    end
end

'''

# Calculation Error (4/10) - Track last opened pack
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = 'function Card:open()'
position = 'after'
match_indent = true
payload = '''
    G.GAME.last_booster_pack = self
    G.GAME.rerolled_pack = self.rerolled

'''

# Calculation Error (5/10) - Prevent duplicate pack generation
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = 'if self.ability.set == "Booster" then'
position = 'after'
match_indent = true
payload = '''
    if not G.GAME.rerolled_pack then
'''

# Calculation Error (6/10) - Reroll animation handling
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = 'G.GAME.pack_choices = *'
times = 1
position = 'after'
match_indent = true
payload = '''
    end
    local skip_animation = G.GAME.rerolled_pack and 0 or nil
'''

# Calculation Error (7/10) - Skip opening delay on reroll
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''G.E_MANAGER:add_event(Event({trigger = 'after', delay = 0.4, func = function()'''
position = 'at'
match_indent = true
payload = '''
G.E_MANAGER:add_event(Event({trigger = 'after', delay = skip_animation or 0.4, func = function()
'''

# Calculation Error (8/10) - Prevent pack explosion on reroll
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''self:explode()'''
position = 'at'
match_indent = true
payload = '''
if not G.GAME.rerolled_pack then self:explode() end
'''

# Calculation Error (9/10) - Skip closing delay on reroll
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''G.E_MANAGER:add_event(Event({trigger = 'after', delay = 1.3*math.sqrt(G.SETTINGS.GAMESPEED), blockable = false, blocking = false, func = function()'''
position = 'at'
match_indent = true
payload = '''
G.E_MANAGER:add_event(Event({trigger = 'after', delay = skip_animation or (1.3*math.sqrt(G.SETTINGS.GAMESPEED)), blockable = false, blocking = false, func = function()
'''

# Calculation Error (10/10) - Skip materialization animation on reroll
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = 'card:start_materialize({G.C.WHITE, G.C.WHITE}, nil, 1.5*G.SETTINGS.GAMESPEED)'
position = 'at'
match_indent = true
payload = '''
if not G.GAME.rerolled_pack then
    card:start_materialize({G.C.WHITE, G.C.WHITE}, nil, 1.5*G.SETTINGS.GAMESPEED)
else
    card:juice_up()
end

'''
